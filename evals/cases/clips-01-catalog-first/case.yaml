skill: openclips-clips
shape: pauses-before-spending
turns: 1
fixture: eval-workspace
allow: [list_my_workspaces, list_products, get_product, get_product_by_url, list_brands, get_brand, list_creatives, get_creative, list_avatars, get_avatar, list_skills, load_skill, list_endpoints, marketplace_models, clips_catalog, preview_cost, image_presets, brief_questions]
assert:
  mcp_connected: true
  tools_called_in_order: [clips_catalog]     # the catalogue is the only oracle for lanes and format ids
  tools_not_called: [brief_questions]        # a film with no script to approve skips the words-first step
  denied_tools: []
  result_regex: '(?i)(proceed\?|go ahead|approve|shall I|which format)'
