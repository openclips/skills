skill: openclips-saas-explainer
shape: presentation
turns: 1
fixture: eval-workspace
allow: [list_my_workspaces, list_products, get_product, get_product_by_url, list_brands, get_brand, list_creatives, get_creative, list_avatars, get_avatar, list_skills, load_skill, list_endpoints, marketplace_models, clips_catalog]
assert:
  mcp_connected: true
  tools_called_in_order: [clips_catalog]
  denied_tools: []
  result_regex_all:
    - '(?i)english'                                                   # says the paper lane renders English only
    - '(?i)(instead|alternative|other lane|creator|ugc|in english)'   # offers a lane whose catalogue lists German, or English
  result_not_regex: '(?i)lang(uage)?["'']?\s*[:=]\s*["'']?de\b'   # never composes or previews a German paper body
