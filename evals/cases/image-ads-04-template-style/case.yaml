skill: openclips-image-ads
shape: routes-right
turns: 1
fixture: eval-workspace
allow: [list_my_workspaces, list_products, get_product, get_product_by_url, list_brands, get_brand, list_creatives, get_creative, list_avatars, get_avatar, list_skills, load_skill, list_endpoints, marketplace_models, clips_catalog]
assert:
  mcp_connected: true
  tools_called_in_order: [load_skill]
  denied_tools: []
  result_regex_all:
    - '(?i)template lane|image templates|template-based|preset template'   # names the route it chose, not just the word the user said
    - '(?i)(output format|formats?|sizes?)\b.{0,60}\?'                   # asks which formats, since the lane requires at least one
