skill: openclips-edit
shape: presentation
turns: 1
fixture: eval-workspace
allow: [list_my_workspaces, list_products, get_product, get_product_by_url, list_brands, get_brand, list_creatives, get_creative, list_avatars, get_avatar, list_skills, load_skill, list_endpoints, marketplace_models, clips_catalog]
assert:
  mcp_connected: true
  tools_not_called: [generate_marketplace_proxy, revise_creative_variate]
  denied_tools: []          # the ad-copy route is free but still waits for a yes: no attempt in turn one
  result_regex: '(?i)(landing page|landingPageUrl|url)'   # names the landing page it will use before running
  result_not_regex: '(?i)(this will cost [1-9]|costs? [1-9]\d* credits|preview(ed)? the cost)'   # ad copy costs nothing; no cost gate theatre
