skill: openclips-edit
shape: presentation
turns: 1
fixture: eval-workspace
allow: [list_my_workspaces, list_products, get_product, get_product_by_url, list_brands, get_brand, list_creatives, get_creative, list_avatars, get_avatar, list_skills, load_skill, list_endpoints, marketplace_models, clips_catalog, preview_cost, image_presets, brief_questions]
assert:
  mcp_connected: true
  denied_tools: []          # the watermark cannot be undone: nothing is attempted on the message that asks
  result_regex_all:
    - '#\d+'                # names the creative by id
    - '(?i)(cannot be (undone|removed)|can.t be (undone|removed)|irreversible|permanent|no longer (be )?served|clean (master|copy|version))'
