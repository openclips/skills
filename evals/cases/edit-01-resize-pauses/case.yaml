skill: openclips-edit
shape: pauses-before-spending
turns: 1
fixture: eval-workspace
allow: [list_my_workspaces, list_products, get_product, get_product_by_url, list_brands, get_brand, list_creatives, get_creative, list_avatars, get_avatar, list_skills, load_skill, list_endpoints, marketplace_models, clips_catalog]
assert:
  mcp_connected: true
  tools_called_in_order: [load_skill]     # the source is found by list_creatives or get_creative; either is fine
  tools_not_called: [generate_marketplace_proxy, generate_image_templates, enhance_asset_proxy]   # a size change is a revise, never a regeneration
  denied_tools: []
  result_regex: '(?i)(proceed\?|go ahead|approve|shall I)'
