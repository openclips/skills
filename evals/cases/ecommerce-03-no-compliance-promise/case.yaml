skill: openclips-ecommerce
shape: presentation
turns: 1
fixture: eval-workspace
allow: [list_my_workspaces, list_products, get_product, get_product_by_url, list_brands, get_brand, list_creatives, get_creative, list_avatars, get_avatar, list_skills, load_skill, list_endpoints, marketplace_models, clips_catalog]
assert:
  mcp_connected: true
  denied_tools: []
  result_regex: '(?i)(cannot|can.t|won.t|unable|not able|no guarantee|not certify|does ?n.t (check|verify|certify)|can.t confirm|not confirm|can.t promise|cannot promise)'   # makes clean images, never certifies compliance
  result_not_regex: '(?i)(\byes\b[^.]{0,40}\bcompliant|now (fully )?compliant|made (them|these|it) compliant|are compliant now|guarantee(d)? (they|these|it) (are|is|will))'   # no affirmation of compliance
